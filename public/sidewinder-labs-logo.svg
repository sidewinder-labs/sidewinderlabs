<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2566"/>
      <stop offset="1" stop-color="#110f2b"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f5fa"/>
      <stop offset="0.55" stop-color="#c9d1df"/>
      <stop offset="1" stop-color="#8f9ab0"/>
    </linearGradient>
    <linearGradient id="flame" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#7ee8ff"/>
      <stop offset="0.45" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="core" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#fff6d6"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3c66a"/>
      <stop offset="1" stop-color="#d9973e"/>
    </linearGradient>
    <!-- regions where the snake passes OVER the missile -->
    <clipPath id="over">
      <rect x="0" y="0" width="242" height="512"/>
      <rect x="300" y="0" width="212" height="512"/>
    </clipPath>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>

  <!-- background: desert dusk -->
  <rect width="512" height="512" rx="112" fill="url(#sky)"/>
  <!-- faint sidewinder tracks in the sand: parallel J-shaped marks -->
  <g clip-path="url(#tile)" stroke="#ffffff" stroke-opacity="0.06" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M18 452 q30 -14 46 -40"/>
    <path d="M40 470 q30 -14 46 -40"/>
    <path d="M96 488 q30 -14 46 -40"/>
    <path d="M152 506 q30 -14 46 -40"/>
  </g>

  <g transform="translate(256 262) scale(1.2) translate(-256 -256)">
  <g transform="rotate(-35 256 256)">
    <!-- snake: full body, drawn BEHIND the missile -->
    <g id="snake">
      <path id="body" d="M128 202 C160 202 176 306 216 306 C256 306 262 206 302 206 C332 206 348 214 370 222"
            fill="none" stroke="url(#sand)" stroke-width="26" stroke-linecap="round"/>
      <path d="M128 202 C160 202 176 306 216 306 C256 306 262 206 302 206 C332 206 348 214 370 222"
            fill="none" stroke="#9a5422" stroke-width="12" stroke-linecap="round" stroke-dasharray="9 17" stroke-dashoffset="4"/>
    </g>

    <!-- exhaust -->
    <path d="M142 240 Q92 248 46 256 Q92 264 142 272 Z" fill="url(#flame)"/>
    <path d="M142 248 Q112 252 88 256 Q112 260 142 264 Z" fill="url(#core)"/>

    <!-- missile -->
    <path d="M152 240 L118 204 L184 240 Z" fill="#7d889f"/>
    <path d="M152 272 L118 308 L184 272 Z" fill="#7d889f"/>
    <rect x="142" y="244" width="12" height="24" rx="3" fill="#5b6478"/>
    <rect x="150" y="238" width="202" height="36" rx="7" fill="url(#steel)"/>
    <path d="M350 238 Q408 240 428 256 Q408 272 350 274 Z" fill="url(#steel)"/>
    <rect x="328" y="238" width="7" height="36" fill="#38bdf8"/>
    <path d="M316 238 L304 220 L336 238 Z" fill="#7d889f"/>
    <path d="M316 274 L304 292 L336 274 Z" fill="#7d889f"/>

    <!-- snake again, clipped to the parts that pass OVER the missile -->
    <g clip-path="url(#over)">
      <path d="M128 202 C160 202 176 306 216 306 C256 306 262 206 302 206 C332 206 348 214 370 222"
            fill="none" stroke="url(#sand)" stroke-width="26" stroke-linecap="round"/>
      <path d="M128 202 C160 202 176 306 216 306 C256 306 262 206 302 206 C332 206 348 214 370 222"
            fill="none" stroke="#9a5422" stroke-width="12" stroke-linecap="round" stroke-dasharray="9 17" stroke-dashoffset="4"/>
    </g>

    <!-- rattle at the tail -->
    <g fill="#e8d3a2" stroke="#9a5422" stroke-width="2">
      <ellipse cx="114" cy="200" rx="8" ry="10"/>
      <ellipse cx="102" cy="199" rx="7" ry="8.5"/>
      <ellipse cx="92" cy="198" rx="6" ry="7"/>
    </g>

    <!-- head: triangular viper head, guiding at the nose -->
    <path d="M360 206 Q384 200 404 214 Q414 222 404 230 Q384 244 360 238 Q352 222 360 206 Z" fill="url(#sand)"/>
    <!-- supraocular horn: the sidewinder's signature -->
    <path d="M380 207 L386 193 L392 209 Z" fill="#c98432"/>
    <circle cx="387" cy="215" r="4.5" fill="#1a1433"/>
    <circle cx="388.5" cy="213.5" r="1.4" fill="#ffffff"/>
    <!-- forked tongue -->
    <path d="M410 223 L428 222 M428 222 L436 216 M428 222 L436 228" stroke="#ef4f6b" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
  </g>
</svg>
